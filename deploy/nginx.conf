##
## ais-forwarder — nginx front-end for  https://canbo.at/ais-harlingen/
## ---------------------------------------------------------------------------
## canbo.at is a shared host serving ~10 domains, so this config is split so it
## drops in without touching the other vhosts. Everything is prefixed `ais_`
## and scoped to the /ais-harlingen/ location; nothing here is global except
## the three zone definitions and the cache path (all uniquely named).
##
##   PART A  (http{} context)   -> save as /etc/nginx/conf.d/ais-harlingen.conf
##   PART B  (a location block) -> paste inside your existing
##                                 `server { server_name canbo.at; ... }`
##
## The app is path-agnostic: nginx strips the /ais-harlingen/ prefix (the
## trailing slash on proxy_pass) so the backend only ever sees /, /api/vessels
## and /api/stats. The HTML carries <base href="/ais-harlingen/"> so assets and
## fetch() calls resolve under the subpath. To move it, change only this file.
##
## DoS posture: the dashboard is read-only and everyone wants identical data,
## so the real defense is the microcache below — a flood of pollers is absorbed
## by nginx and the backend sees at most ~1 request/sec per endpoint regardless
## of client count. Rate/conn limits and tight timeouts protect nginx itself.
##

## ==========================================================================
## PART A — http{} context   (/etc/nginx/conf.d/ais-harlingen.conf)
## ==========================================================================

# Per-IP request-rate zones. A 10m zone holds ~160k unique IPs.
limit_req_zone  $binary_remote_addr zone=ais_api:10m    rate=5r/s;
limit_req_zone  $binary_remote_addr zone=ais_static:10m rate=30r/s;

# Per-IP concurrent-connection cap.
limit_conn_zone $binary_remote_addr zone=ais_conn:10m;

# Response cache shared by the API and the static shell. The default cache key
# ($scheme$proxy_host$request_uri) keeps /api/vessels, /api/stats and each
# asset separate. Directory must exist and be writable by the nginx user:
#   install -d -o www-data -g www-data /var/cache/nginx/ais-harlingen
proxy_cache_path /var/cache/nginx/ais-harlingen levels=1:2
                 keys_zone=ais_cache:10m max_size=200m inactive=1h
                 use_temp_path=off;

# The ais-forwarder web server. It binds 0.0.0.0:8080 on the AIS host and is
# reached over your tunnel/VPN. keepalive keeps that connection warm.
upstream ais_backend {
    server 10.0.67.7:8080;      # <-- CHANGE to the app's reachable address:port
    keepalive 8;
}

## ==========================================================================
## PART B — paste into the existing  server { server_name canbo.at; ... }
## ==========================================================================

# Send the bare path to the canonical trailing-slash form.
location = /ais-harlingen { return 301 /ais-harlingen/; }

# ---- JSON API -------------------------------------------------------------
# Microcached: this is what makes the backend un-floodable through the API.
location ^~ /ais-harlingen/api/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    limit_req         zone=ais_api burst=10 nodelay;
    limit_conn        ais_conn 20;
    limit_req_status  429;
    limit_conn_status 429;

    client_max_body_size 1k;      # read-only API; no reason to accept a body
    client_body_timeout  5s;
    send_timeout         10s;

    proxy_pass         http://ais_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    8s;

    proxy_cache            ais_cache;
    proxy_cache_valid      200 5s;   # data changes on the app's own cadence
    proxy_cache_lock       on;       # collapse concurrent misses into 1 upstream req
    proxy_cache_lock_timeout 3s;
    proxy_cache_use_stale  error timeout updating;  # ride out backend hiccups
    add_header X-Cache $upstream_cache_status;
}

# ---- Static shell (HTML/JS/CSS/fonts served by the app) -------------------
# Cached hard at nginx since it can't read the app's files from disk directly.
location ^~ /ais-harlingen/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    limit_req         zone=ais_static burst=60 nodelay;
    limit_conn        ais_conn 20;
    limit_req_status  429;
    limit_conn_status 429;

    client_max_body_size 1k;
    client_body_timeout  5s;
    send_timeout         10s;

    proxy_pass         http://ais_backend/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    8s;

    proxy_cache        ais_cache;
    proxy_cache_valid  200 1h;       # app shell rarely changes
    proxy_cache_lock   on;
    add_header X-Cache $upstream_cache_status;

    # The map uses MapLibre GL (WebGL) with raster tiles fetched by the browser
    # directly: an OpenStreetMap base plus the OpenSeaMap seamark overlay.
    # MapLibre fetches raster tiles over XHR (connect-src) and rasterises them on
    # a worker (worker-src blob:); img-src blob:/data: covers the canvas. The
    # MapLibre script is served from this origin (script-src 'self'). Update the
    # tile hosts below if you switch providers.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tiles.openseamap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src blob:; child-src blob:; connect-src 'self' https://*.tile.openstreetmap.org https://tiles.openseamap.org; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

## ---------------------------------------------------------------------------
## Notes
## ---------------------------------------------------------------------------
## * Slowloris (slow headers) can only be bounded per-server, not per-location,
##   because headers are read before nginx picks a location. If the whole
##   canbo.at vhost doesn't already set them, add inside its server{}:
##       client_header_timeout 5s;
##       keepalive_timeout     30s;
##   These affect all paths on canbo.at, so only add if that's acceptable.
##
## * server_tokens off;  belongs at http{} level for the whole host — set it
##   once globally rather than here.
##
## * nginx cannot absorb a volumetric L3/L4 flood that saturates the uplink;
##   that needs an upstream scrubber (Cloudflare / provider). Everything above
##   is L7. Pair it with fail2ban on the access log banning repeat-429 IPs, and
##   kernel knobs: net.ipv4.tcp_syncookies=1, a larger net.core.somaxconn.
